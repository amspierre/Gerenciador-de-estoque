<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Armazém · Planta Baixa</title>

<style>
:root{
    --bg:#f5f6f8;
    --card:#fff;
    --border:#e8eaee;
    --text:#17191d;
    --muted:#8a8f98;
    --green:#22a35a;
    --amber:#e9a11b;
    --red:#e05252;
    --blue:#4a8fe7;
    --empty:#eef0f3;
    --radius:14px;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:32px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

#dashboard{
    width:100%;
    max-width:1200px;
    margin:auto;
}

/* HEADER */

#page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:28px;
    flex-wrap:wrap;
}

#header-left{
    display:flex;
    flex-direction:column;
    gap:5px;
}

#header-title-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

#header-title{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:-.4px;
}

#header-subtitle{
    font-size:12px;
    color:var(--muted);
}

#header-right{
    display:flex;
    align-items:center;
    gap:22px;
    flex-wrap:wrap;
}

/* LEGENDA */

#legend{
    display:flex;
    gap:14px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
}

.legend-swatch{
    width:9px;
    height:9px;
    border-radius:3px;
}

#legend-swatch-ocupado{
    background:var(--green);
}

#legend-swatch-alerta{
    background:var(--amber);
}

#legend-swatch-livre{
    background:var(--empty);
    border:1px solid #ddd;
}

/* STATUS */

#status-block{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:12px;
    color:var(--muted);
}

#status-title{
    font-weight:600;
    color:var(--text);
}

#status-indicator{
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--green);
}

#status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
}

/* LAYOUT */

#main-layout{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:20px;
    align-items:start;
}

/* CARDS */

#warehouse-grid-card,
.stat-card,
.panel-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
}

/* GRID */

#warehouse-grid-card{
    padding:30px;
}

#warehouse-grid-wrapper{
    width:100%;
}

#warehouse-grid{
    display:grid;
    grid-template-columns:30px repeat(3,90px);
    grid-auto-rows:90px;
    gap:10px;
    justify-content:center;
    align-items:center;
}

.col-header{
    font-size:11px;
    color:#a0a5ad;
    text-align:center;
}

.row-label{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:8px;
    font-size:11px;
    color:#a0a5ad;
}

.slot{
    width:90px;
    height:90px;
    border-radius:10px;
    background:var(--empty);
    cursor:pointer;
    transition:.15s ease;
}

.slot:hover{
    transform:scale(1.05);
}

.slot.ocupado-1{
    background:#a9ddbf;
}

.slot.ocupado-2{
    background:var(--green);
}

.slot.alerta{
    background:var(--amber);
}

#grid-footnote{
    margin-top:22px;
    text-align:center;
    font-size:10px;
    color:#a0a5ad;
}

/* COLUNA DIREITA */

#right-column{
    display:flex;
    flex-direction:column;
    gap:16px;
}

/* ESTATÍSTICAS */

#stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.stat-card{
    padding:18px;
}

.stat-label{
    margin-bottom:10px;
    font-size:10px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:.04em;
}

.stat-value{
    margin-bottom:5px;
    font-size:28px;
    font-weight:700;
    letter-spacing:-1px;
}

.stat-unit{
    font-size:11px;
    color:var(--muted);
}

#stat-estoque-atual{
    color:var(--green);
}

#stat-entradas-hoje{
    color:var(--blue);
}

#stat-saidas-hoje{
    color:var(--red);
}

#stat-ocupacao{
    color:var(--green);
}

/* PAINÉIS */

.panel-card{
    padding:18px;
}

.panel-title{
    margin-bottom:12px;
    font-size:11px;
    font-weight:700;
    color:#666b73;
}

/* LOG */

#log-list{
    display:flex;
    flex-direction:column;
    max-height:220px;
    overflow-y:auto;
}

#log-list::-webkit-scrollbar{
    width:4px;
}

#log-list::-webkit-scrollbar-thumb{
    background:#ddd;
    border-radius:4px;
}

.log-row{
    display:grid;
    grid-template-columns:1.5fr .8fr .8fr .4fr;
    gap:8px;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid #f0f1f3;
    font-size:10px;
}

.log-row:last-child{
    border-bottom:none;
}

.log-datahora{
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
}

.log-tipo-entrada{
    color:var(--green);
    font-weight:700;
}

.log-tipo-saida{
    color:var(--red);
    font-weight:700;
}

.log-caixa{
    color:var(--text);
}

.log-status-ok{
    color:var(--muted);
}

/* ALERTAS */

#alerts-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.alert-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:11px;
    border-radius:9px;
    background:#f8f9fa;
}

.alert-icon{
    width:7px;
    height:7px;
    margin-top:4px;
    border-radius:50%;
    flex-shrink:0;
}

.alert-icon.level-warning{
    background:var(--amber);
}

.alert-icon.level-critical{
    background:var(--red);
}

.alert-icon.level-info{
    background:var(--blue);
}

.alert-body{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.alert-title{
    font-size:11px;
    font-weight:700;
}

.alert-desc{
    font-size:10px;
    line-height:1.4;
    color:var(--muted);
}

#alerts-empty{
    font-size:11px;
    color:var(--muted);
}

/* RESPONSIVO */

@media(max-width:860px){

    body{
        padding:20px;
    }

    #main-layout{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    #warehouse-grid-card{
        padding:20px 10px;
    }

    #warehouse-grid{
        grid-template-columns:25px repeat(3,70px);
        grid-auto-rows:70px;
        gap:7px;
    }

    .slot{
        width:70px;
        height:70px;
        border-radius:8px;
    }

    #stats-grid{
        grid-template-columns:1fr 1fr;
    }

    .log-row{
        grid-template-columns:1.4fr .8fr .7fr .4fr;
    }

}
</style>
</head>

<body>

<div id="dashboard">

    <!-- HEADER -->

    <div id="page-header">

        <div id="header-left">

            <div id="header-title-row">

                <h1 id="header-title">
                    Armazém
                </h1>

                <span id="header-subtitle">
                    Planta baixa · 3 × 3 · 9 slots
                </span>

            </div>

        </div>

        <div id="header-right">

            <div id="legend">

                <div class="legend-item">
                    <span
                        class="legend-swatch"
                        id="legend-swatch-ocupado">
                    </span>
                    Ocupado
                </div>

                <div class="legend-item">
                    <span
                        class="legend-swatch"
                        id="legend-swatch-alerta">
                    </span>
                    Alerta
                </div>

                <div class="legend-item">
                    <span
                        class="legend-swatch"
                        id="legend-swatch-livre">
                    </span>
                    Livre
                </div>

            </div>

            <div id="status-block">

                <span id="status-title">
                    CD
                </span>

                <div id="status-indicator">

                    <span id="status-dot"></span>

                    <span id="status-text">
                        Online
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- CONTEÚDO -->

    <div id="main-layout">

        <!-- GRID -->

        <div id="warehouse-grid-card">

            <div id="warehouse-grid-wrapper">

                <div id="warehouse-grid">

                    <div class="corner-header"></div>

                </div>

            </div>

            <div id="grid-footnote">
                Clique em um slot para alterar o estado
            </div>

        </div>


        <!-- COLUNA DIREITA -->

        <div id="right-column">

            <!-- ESTATÍSTICAS -->

            <div id="stats-grid">

                <div class="stat-card">

                    <div
                        class="stat-label"
                        id="label-estoque-atual">
                        ESTOQUE ATUAL
                    </div>

                    <div
                        class="stat-value"
                        id="stat-estoque-atual">
                        57
                    </div>

                    <div
                        class="stat-unit"
                        id="unit-estoque-atual">
                        caixas no CD
                    </div>

                </div>


                <div class="stat-card">

                    <div
                        class="stat-label"
                        id="label-entradas-hoje">
                        ENTRADAS HOJE
                    </div>

                    <div
                        class="stat-value"
                        id="stat-entradas-hoje">
                        45
                    </div>

                    <div
                        class="stat-unit"
                        id="unit-entradas-hoje">
                        caixas
                    </div>

                </div>


                <div class="stat-card">

                    <div
                        class="stat-label"
                        id="label-saidas-hoje">
                        SAÍDAS HOJE
                    </div>

                    <div
                        class="stat-value"
                        id="stat-saidas-hoje">
                        37
                    </div>

                    <div
                        class="stat-unit"
                        id="unit-saidas-hoje">
                        caixas
                    </div>

                </div>


                <div class="stat-card">

                    <div
                        class="stat-label"
                        id="label-ocupacao">
                        OCUPAÇÃO
                    </div>

                    <div
                        class="stat-value"
                        id="stat-ocupacao">
                        57%
                    </div>

                    <div
                        class="stat-unit"
                        id="unit-ocupacao">
                        do espaço
                    </div>

                </div>

            </div>


            <!-- LOG -->

            <div class="panel-card">

                <div
                    class="panel-title"
                    id="title-log">
                    LOG DE CONFERÊNCIA
                </div>

                <div id="log-list"></div>

            </div>


            <!-- ALERTAS -->

            <div class="panel-card">

                <div
                    class="panel-title"
                    id="title-alerts">
                    ALERTAS DO SISTEMA
                </div>

                <div id="alerts-list"></div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================
   CONFIGURAÇÃO DA GRID
========================= */

const COLS = 3;

const ROWS = [
    "A",
    "B",
    "C"
];


/*
0 = livre
1 = ocupado
2 = ocupado
3 = alerta
*/

const layout = {

    A: [1, 0, 2],

    B: [0, 2, 0],

    C: [1, 1, 2]

};


const statusClass = [
    "livre",
    "ocupado-1",
    "ocupado-2",
    "alerta"
];


const gridEl =
    document.getElementById("warehouse-grid");


/* =========================
   CABEÇALHO DAS COLUNAS
========================= */

for(let c = 1; c <= COLS; c++){

    const div =
        document.createElement("div");

    div.className =
        "col-header";

    div.id =
        "col-header-" + c;

    div.textContent =
        String(c).padStart(2,"0");

    gridEl.appendChild(div);

}


/* =========================
   CRIAÇÃO DOS SLOTS
========================= */

ROWS.forEach(rowLetter => {

    const rowLabel =
        document.createElement("div");

    rowLabel.className =
        "row-label";

    rowLabel.id =
        "row-label-" + rowLetter;

    rowLabel.textContent =
        rowLetter;

    gridEl.appendChild(rowLabel);


    for(let c = 1; c <= COLS; c++){

        const cellId =
            rowLetter + c;

        const div =
            document.createElement("div");

        const state =
            layout[rowLetter][c - 1];


        div.className =
            "slot " + statusClass[state];

        div.id =
            cellId;

        div.dataset.state =
            state;

        div.title =
            "Slot " + cellId;


        /* ALTERAR ESTADO AO CLICAR */

        div.addEventListener("click", () => {

            let s =
                parseInt(
                    div.dataset.state,
                    10
                );

            s =
                (s + 1) %
                statusClass.length;


            div.className =
                "slot " +
                statusClass[s];

            div.dataset.state =
                s;

        });


        gridEl.appendChild(div);

    }

});


/* =========================
   LOG DE CONFERÊNCIA
========================= */

const logEntries = [

    {
        id:1,
        data:"12/08/2026 14:39:20",
        tipo:"ENTRADA",
        caixa:"100391",
        status:"OK"
    },

    {
        id:2,
        data:"12/08/2026 14:33:20",
        tipo:"ENTRADA",
        caixa:"100497",
        status:"OK"
    },

    {
        id:3,
        data:"12/08/2026 14:31:20",
        tipo:"ENTRADA",
        caixa:"100143",
        status:"OK"
    },

    {
        id:4,
        data:"12/08/2026 14:25:20",
        tipo:"SAÍDA",
        caixa:"100477",
        status:"OK"
    },

    {
        id:5,
        data:"12/08/2026 14:23:20",
        tipo:"ENTRADA",
        caixa:"100282",
        status:"OK"
    },

    {
        id:6,
        data:"12/08/2026 14:18:20",
        tipo:"SAÍDA",
        caixa:"100269",
        status:"OK"
    },

    {
        id:7,
        data:"12/08/2026 14:14:20",
        tipo:"SAÍDA",
        caixa:"100445",
        status:"OK"
    },

    {
        id:8,
        data:"12/08/2026 14:09:20",
        tipo:"ENTRADA",
        caixa:"100359",
        status:"OK"
    }

];


const logList =
    document.getElementById("log-list");


logEntries.forEach(entry => {

    const row =
        document.createElement("div");

    row.className =
        "log-row";

    row.id =
        "log-row-" + entry.id;


    const data =
        document.createElement("span");

    data.className =
        "log-datahora";

    data.textContent =
        entry.data;


    const tipo =
        document.createElement("span");

    tipo.className =
        entry.tipo === "ENTRADA"
        ? "log-tipo-entrada"
        : "log-tipo-saida";

    tipo.textContent =
        entry.tipo;


    const caixa =
        document.createElement("span");

    caixa.className =
        "log-caixa";

    caixa.textContent =
        entry.caixa;


    const status =
        document.createElement("span");

    status.className =
        "log-status-ok";

    status.textContent =
        entry.status;


    row.appendChild(data);
    row.appendChild(tipo);
    row.appendChild(caixa);
    row.appendChild(status);

    logList.appendChild(row);

});


/* =========================
   ALERTAS
========================= */

const alerts = [

    {
        id:1,
        level:"critical",
        title:"Slot C3 em alerta",
        desc:"Divergência de contagem detectada — conferência manual necessária."
    },

    {
        id:2,
        level:"warning",
        title:"Estoque baixo — Corredor C",
        desc:"Ocupação abaixo de 15% na fileira C. Reposição recomendada."
    },

    {
        id:3,
        level:"warning",
        title:"Estoque alto — Corredor A",
        desc:"Ocupação acima de 80% na fileira A. Avaliar redistribuição."
    },

    {
        id:4,
        level:"info",
        title:"Saída acima da média",
        desc:"37 caixas expedidas hoje, 18% acima da média das últimas 4 semanas."
    }

];


const alertsList =
    document.getElementById("alerts-list");


if(alerts.length === 0){

    const empty =
        document.createElement("div");

    empty.id =
        "alerts-empty";

    empty.textContent =
        "Nenhum alerta ativo no momento.";

    alertsList.appendChild(empty);

}else{

    alerts.forEach(a => {

        const row =
            document.createElement("div");

        row.className =
            "alert-row";

        row.id =
            "alert-row-" + a.id;


        const icon =
            document.createElement("span");

        icon.className =
            "alert-icon level-" +
            a.level;


        const body =
            document.createElement("div");

        body.className =
            "alert-body";


        const title =
            document.createElement("span");

        title.className =
            "alert-title";

        title.textContent =
            a.title;


        const desc =
            document.createElement("span");

        desc.className =
            "alert-desc";

        desc.textContent =
            a.desc;


        body.appendChild(title);
        body.appendChild(desc);

        row.appendChild(icon);
        row.appendChild(body);

        alertsList.appendChild(row);

    });

}

</script>

</body>
</html>
