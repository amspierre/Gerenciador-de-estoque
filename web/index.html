<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Armazém · Planta Baixa</title>

<style>
:root{
    --bg:#f5f6f8;
    --card:#fff;
    --border:#e8eaee;
    --text:#17191d;
    --muted:#8a8f98;
    --green:#22a35a;
    --amber:#e9a11b;
    --red:#e05252;
    --blue:#4a8fe7;
    --empty:#eef0f3;
    --radius:14px;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:32px;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

#dashboard{
    width:100%;
    max-width:1200px;
    margin:auto;
}

/* HEADER */

#page-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:28px;
    flex-wrap:wrap;
}

#header-left{
    display:flex;
    flex-direction:column;
    gap:5px;
}

#header-title-row{
    display:flex;
    align-items:center;
    gap:12px;
    flex-wrap:wrap;
}

#header-title{
    margin:0;
    font-size:20px;
    font-weight:700;
    letter-spacing:-.4px;
}

#header-subtitle{
    font-size:12px;
    color:var(--muted);
}

#header-right{
    display:flex;
    align-items:center;
    gap:22px;
    flex-wrap:wrap;
}

/* LEGENDA */

#legend{
    display:flex;
    gap:14px;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    color:var(--muted);
}

.legend-swatch{
    width:9px;
    height:9px;
    border-radius:3px;
}

#legend-swatch-ocupado{
    background:var(--green);
}

#legend-swatch-alerta{
    background:var(--amber);
}

#legend-swatch-livre{
    background:var(--empty);
    border:1px solid #ddd;
}

/* STATUS */

#status-block{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:12px;
    color:var(--muted);
}

#status-title{
    font-weight:600;
    color:var(--text);
}

#status-indicator{
    display:flex;
    align-items:center;
    gap:5px;
    color:var(--green);
}

#status-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
}

/* LAYOUT */

#main-layout{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:20px;
    align-items:start;
}

/* CARDS */

#warehouse-grid-card,
.stat-card,
.panel-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
}

/* GRID */

#warehouse-grid-card{
    padding:30px;
}

#warehouse-grid-wrapper{
    width:100%;
}

#warehouse-grid{
    display:grid;
    grid-template-columns:30px repeat(10, 52px);
    grid-auto-rows:52px;
    gap:8px;
    justify-content:center;
    align-items:center;
}

.col-header{
    font-size:11px;
    color:#a0a5ad;
    text-align:center;
}

.row-label{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    padding-right:8px;
    font-size:11px;
    color:#a0a5ad;
}

.slot{
    width:52px;
    height:52px;
    border-radius:10px;
    background:var(--empty);
    cursor:pointer;
    transition:.15s ease;
}

.slot:hover{
    transform:scale(1.05);
}

.slot.ocupado-1{
    background:#a9ddbf;
}

.slot.ocupado-2{
    background:var(--green);
}

.slot.alerta{
    background:var(--amber);
}

#grid-footnote{
    margin-top:22px;
    text-align:center;
    font-size:10px;
    color:#a0a5ad;
}

/* COLUNA DIREITA */

#right-column{
    display:flex;
    flex-direction:column;
    gap:16px;
}

/* ESTATÍSTICAS */

#stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.stat-card{
    padding:18px;
}

.stat-label{
    margin-bottom:10px;
    font-size:10px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:.04em;
}

.stat-value{
    margin-bottom:5px;
    font-size:28px;
    font-weight:700;
    letter-spacing:-1px;
}

.stat-unit{
    font-size:11px;
    color:var(--muted);
}

#stat-estoque-atual{
    color:var(--green);
}

#stat-entradas-hoje{
    color:var(--blue);
}

#stat-saidas-hoje{
    color:var(--red);
}

#stat-ocupacao{
    color:var(--green);
}

/* PAINÉIS */

.panel-card{
    padding:18px;
}

.panel-title{
    margin-bottom:12px;
    font-size:11px;
    font-weight:700;
    color:#666b73;
}

/* LOG */

#log-list{
    display:flex;
    flex-direction:column;
    max-height:220px;
    overflow-y:auto;
}

#log-list::-webkit-scrollbar{
    width:4px;
}

#log-list::-webkit-scrollbar-thumb{
    background:#ddd;
    border-radius:4px;
}

.log-row{
    display:grid;
    grid-template-columns:1.5fr .8fr .8fr .4fr;
    gap:8px;
    align-items:center;
    padding:9px 0;
    border-bottom:1px solid #f0f1f3;
    font-size:10px;
}

.log-row:last-child{
    border-bottom:none;
}

.log-datahora{
    color:var(--muted);
    overflow:hidden;
    text-overflow:ellipsis;
}

.log-tipo-entrada{
    color:var(--green);
    font-weight:700;
}

.log-tipo-saida{
    color:var(--red);
    font-weight:700;
}

.log-caixa{
    color:var(--text);
}

.log-status-ok{
    color:var(--muted);
}

/* ALERTAS */

#alerts-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.alert-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:11px;
    border-radius:9px;
    background:#f8f9fa;
}

.alert-icon{
    width:7px;
    height:7px;
    margin-top:4px;
    border-radius:50%;
    flex-shrink:0;
}

.alert-icon.level-warning{
    background:var(--amber);
}

.alert-icon.level-critical{
    background:var(--red);
}

.alert-icon.level-info{
    background:var(--blue);
}

.alert-body{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.alert-title{
    font-size:11px;
    font-weight:700;
}

.alert-desc{
    font-size:10px;
    line-height:1.4;
    color:var(--muted);
}

#alerts-empty{
    font-size:11px;
    color:var(--muted);
}

/* RESPONSIVO */

@media(max-width:860px){

    body{
        padding:20px;
    }

    #main-layout{
        grid-template-columns:1fr;
    }

}

@media(max-width:500px){

    #warehouse-grid-card{
        padding:20px 10px;
    }

    #warehouse-grid{
        grid-template-columns:22px repeat(10, 28px);
        grid-auto-rows:28px;
        gap:6px;
    }

    .slot{
        width:28px;
        height:28px;
        border-radius:8px;
    }

    #stats-grid{
        grid-template-columns:1fr 1fr;
    }

    .log-row{
        grid-template-columns:1.4fr .8fr .7fr .4fr;
    }

}
</style>
</head>

<body>

<div id="dashboard">

    <!-- HEADER -->

    <div id="page-header">

        <div id="header-left">

            <div id="header-title-row">

                <h1 id="header-title">
                    Armazém
                </h1>

                <span id="header-subtitle">
                    Planta baixa · 10 × 10 · 100 slots
                </span>

            </div>

        </div>

        <div id="header-right">

            <div id="legend">

                <div class="legend-item">
                    <span
                        class="legend-swatch"
                        id="legend-swatch-ocupado">
                    </span>
                    Ocupado
                </div>

                <div class="legend-item">
                    <span
                        class="legend-swatch"

                    </span>
                    Alerta
                </div>

                <div class="legend-item">
                    <span
                        class="legend-swatch"

                <span id="status-title">
                    CD
                </span>

                <div id="status-indicator">

                    <span id="status-dot"></span>

                        Online
                    </span>

                </div>

            </div>

        </div>

    </div>


    <!-- CONTEÚDO -->

    <div id="main-layout">

        <!-- GRID -->

        <div id="warehouse-grid-card">

            <div id="warehouse-grid-wrapper">

                <div id="warehouse-grid">

                    <div class="corner-header"></div>

                </div>

            </div>

            <div id="grid-footnote">
                Clique em um slot para alterar o estado
            </div>

        </div>


        <!-- COLUNA DIREITA -->

        <div id="right-column">

            <!-- ESTATÍSTICAS -->

            <div id="stats-grid">

                <div class="stat-card">

                    <div
                        class="stat-label"
                        id="label-estoque-atual">
                        ESTOQUE ATUAL
                    </div>

                    <div
                        class="stat-value"
                        id="stat-estoque-atual">
                        57
                    </div>

                    <div
                        class="stat-unit"
                        id="unit-estoque-atual">
                        caixas no CD
                    </div>

                </div>


                <div class="stat-card">

                    <div
                        class="stat-label"
                        id="label-entradas-hoje">
                        ENTRADAS HOJE
                    </div>

                    <div
                        class="stat-value"
                        id="stat-entradas-hoje">
                        45
                    </div>

                    <div
                        class="stat-unit"
                        id="unit-entradas-hoje">
                        caixas
                    </div>

                </div>


                <div class="stat-card">

                    <div
                        class="stat-label"
                        id="label-saidas-hoje">
                        SAÍDAS HOJE
                    </div>

                    <div
                        class="stat-value"
                        id="stat-saidas-hoje">
                        37
                    </div>

                    <div
                        class="stat-unit"
                        id="unit-saidas-hoje">
                        caixas
                    </div>

                </div>

                        class="stat-label"
                        id="label-ocupacao">

            <!-- AÇÕES -->

            <div class="panel-card">
                <div class="panel-title" id="title-actions">AÇÕES DO ARMAZÉM</div>

                <div id="warehouse-actions" style="display:grid; gap:10px;">
                    <label style="display:grid; gap:6px; font-size:11px; color:#666b73;">
                        RFID
                        <input id="rfid-input" type="text" maxlength="20" placeholder="Ex.: RFID-001" style="padding:10px 12px; border:1px solid #dfe3ea; border-radius:10px; font-size:13px; background:#f9fafb;">
                    </label>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">

                            Linha
                            <input id="row-input" type="number" min="1" max="10" placeholder="1" style="padding:10px 12px; border:1px solid #dfe3ea; border-radius:10px; font-size:13px; background:#f9fafb;">

                        <button id="btn-move" type="button" style="padding:10px 12px; border:none; border-radius:10px; background:#4a8fe7; color:white; font-weight:700; cursor:pointer;">Mover caixa</button>

                    class="panel-title"

                    class="panel-title"

                    ALERTAS DO SISTEMA
                </div>

<script>

const API_BASE_URL = "http://127.0.0.1:8000/api/v1/warehouse";
const GRID_ROWS = 10;
const GRID_COLS = 10;

const gridEl = document.getElementById("warehouse-grid");
const logList = document.getElementById("log-list");
const alertsList = document.getElementById("alerts-list");
const statusText = document.getElementById("status-text");
const statusDot = document.getElementById("status-dot");
const rfidInput = document.getElementById("rfid-input");
const rowInput = document.getElementById("row-input");
const columnInput = document.getElementById("column-input");
const actionMessage = document.getElementById("action-message");

let warehouseBoxes = [];

function setStatus(isOnline) {
    statusText.textContent = isOnline ? "Online" : "Offline";
    statusDot.style.background = isOnline ? "#22a35a" : "#e05252";
    statusText.parentElement.style.color = isOnline ? "#22a35a" : "#e05252";
}

function setActionMessage(message, isError = false) {
    actionMessage.textContent = message;
    actionMessage.style.color = isError ? "#e05252" : "#4a8fe7";
}

async function apiRequest(url, options = {}) {
    const response = await fetch(url, {
        headers: {
            Accept: "application/json",
            ...(options.headers || {})
        },
        ...options
    });

    if (!response.ok) {
        let payload = {};

        try {
            payload = await response.json();
        } catch (error) {
            payload = {};
        }

        throw new Error(payload.detail || `Erro HTTP ${response.status}`);
    }

    const contentType = response.headers.get("content-type") || "";
    if (contentType.includes("application/json")) {
        return response.json();
    }

    if (response.status === 204) {
        return null;
    }

    return null;
}

function normalizeTag(tag) {
    return String(tag || "").trim();
}

function buildGridHeaders() {
    gridEl.innerHTML = "";

    const corner = document.createElement("div");
    corner.className = "corner-header";
    gridEl.appendChild(corner);

    for (let c = 1; c <= GRID_COLS; c++) {
        const header = document.createElement("div");
        header.className = "col-header";
        header.id = "col-header-" + c;
        header.textContent = String(c).padStart(2, "0");
        gridEl.appendChild(header);
    }
}

function renderGrid(boxes) {
    warehouseBoxes = boxes || [];
    buildGridHeaders();

    const occupiedMap = new Map();
    warehouseBoxes.forEach(box => {
        const row = Number(box.row);
        const column = Number(box.column);

        if (!Number.isNaN(row) && !Number.isNaN(column)) {
            occupiedMap.set(`${row}-${column}`, box);
        }
    });

    for (let row = 0; row < GRID_ROWS; row++) {
        const rowLabel = document.createElement("div");
        rowLabel.className = "row-label";
        rowLabel.id = "row-label-" + (row + 1);
        rowLabel.textContent = String.fromCharCode(65 + row);
        gridEl.appendChild(rowLabel);

        for (let column = 0; column < GRID_COLS; column++) {
            const box = occupiedMap.get(`${row}-${column}`);
            const cell = document.createElement("div");
            const isOccupied = Boolean(box);

            cell.className = "slot " + (isOccupied ? "ocupado-2" : "livre");
            cell.id = `${String.fromCharCode(65 + row)}${column + 1}`;
            cell.dataset.state = isOccupied ? "2" : "0";
            cell.title = isOccupied
                ? `RFID: ${box.tag_rfid} | Linha ${row + 1} | Coluna ${column + 1}`
                : `Slot ${String.fromCharCode(65 + row)}${column + 1}`;

            if (isOccupied) {
                cell.setAttribute("aria-label", `Slot ocupado com RFID ${box.tag_rfid}`);
            }

            cell.addEventListener("click", () => {
                if (box) {
                    rfidInput.value = box.tag_rfid;
                    rowInput.value = Number(box.row) + 1;
                    columnInput.value = Number(box.column) + 1;
                    setActionMessage(`Caixa selecionada: ${box.tag_rfid}`);
                    return;
                }

                rowInput.value = row + 1;
                columnInput.value = column + 1;
                setActionMessage(`Slot livre selecionado: ${String.fromCharCode(65 + row)}${column + 1}`);
            });

            gridEl.appendChild(cell);
        }
    }
}

function renderStats(totalBoxes, occupancyPercentage, audit) {
    document.getElementById("stat-estoque-atual").textContent = totalBoxes;
    document.getElementById("stat-ocupacao").textContent = `${Math.round(occupancyPercentage)}%`;

    const today = new Date();
    const todayISO = today.toISOString().slice(0, 10);

    const entradasHoje = (audit || []).filter(item => {
        const itemDate = new Date(item.timestamp);
        return item.status === "INPUT" && !Number.isNaN(itemDate.getTime()) && itemDate.toISOString().slice(0, 10) === todayISO;
    }).length;

    const saidasHoje = (audit || []).filter(item => {
        const itemDate = new Date(item.timestamp);
        return item.status === "OUTPUT" && !Number.isNaN(itemDate.getTime()) && itemDate.toISOString().slice(0, 10) === todayISO;
    }).length;

    document.getElementById("stat-entradas-hoje").textContent = entradasHoje;
    document.getElementById("stat-saidas-hoje").textContent = saidasHoje;
}

function renderLog(audit) {
    logList.innerHTML = "";

    const recentEntries = (audit || []).slice(0, 8);

    if (!recentEntries.length) {
        const empty = document.createElement("div");
        empty.className = "log-row";
        empty.textContent = "Nenhuma movimentação registrada.";
        logList.appendChild(empty);
        return;
    }

    recentEntries.forEach(entry => {
        const row = document.createElement("div");
        row.className = "log-row";

        const data = document.createElement("span");
        data.className = "log-datahora";
        data.textContent = entry.timestamp ? new Date(entry.timestamp).toLocaleString("pt-BR") : "Sem data";

        const tipo = document.createElement("span");
        tipo.className = entry.status === "INPUT" ? "log-tipo-entrada" : "log-tipo-saida";
        tipo.textContent = entry.status === "INPUT" ? "ENTRADA" : "SAÍDA";

        const caixa = document.createElement("span");
        caixa.className = "log-caixa";
        caixa.textContent = entry.tag_rfid;

        const status = document.createElement("span");
        status.className = "log-status-ok";
        status.textContent = "OK";

        row.appendChild(data);
        row.appendChild(tipo);
        row.appendChild(caixa);
        row.appendChild(status);

        logList.appendChild(row);
    });
}

function renderAlerts(totalBoxes, occupancyPercentage) {
    alertsList.innerHTML = "";

    const alerts = [];

    if (occupancyPercentage >= 80) {
        alerts.push({
            level: "warning",
            title: "Armazém em alta ocupação",
            desc: `Ocupação atual em ${Math.round(occupancyPercentage)}%. Avaliar redistribuição.`
        });
    }

    if (occupancyPercentage <= 15) {
        alerts.push({
            level: "info",
            title: "Estoque baixo",
            desc: `Ocupação atual em ${Math.round(occupancyPercentage)}%. Reposição recomendada.`
        });
    }

    if (totalBoxes === 0) {
        alerts.push({
            level: "info",
            title: "Armazém vazio",
            desc: "Nenhuma caixa registrada no momento."
        });
    }

    if (!alerts.length) {
        const empty = document.createElement("div");
        empty.id = "alerts-empty";
        empty.textContent = "Nenhum alerta ativo no momento.";
        alertsList.appendChild(empty);
        return;
    }

    alerts.forEach((alert, index) => {
        const row = document.createElement("div");
        row.className = "alert-row";
        row.id = "alert-row-" + index;

        const icon = document.createElement("span");
        icon.className = "alert-icon level-" + alert.level;

        const body = document.createElement("div");
        body.className = "alert-body";

        const title = document.createElement("span");
        title.className = "alert-title";
        title.textContent = alert.title;

        const desc = document.createElement("span");
        desc.className = "alert-desc";
        desc.textContent = alert.desc;

        body.appendChild(title);
        body.appendChild(desc);

        row.appendChild(icon);
        row.appendChild(body);

        alertsList.appendChild(row);
    });
}

async function loadWarehouseData() {
    try {
        const [boxes, countResponse, occupancyResponse, auditResponse] = await Promise.all([
            apiRequest(`${API_BASE_URL}/`),
            apiRequest(`${API_BASE_URL}/count`),
            apiRequest(`${API_BASE_URL}/occupancy`),
            apiRequest(`${API_BASE_URL}/audit`)
        ]);

        const totalBoxes = Number(countResponse.total_boxes ?? boxes.length ?? 0);
        const occupancy = Number(occupancyResponse.occupancy_percentage ?? 0);

        renderGrid(boxes);
        renderStats(totalBoxes, occupancy, auditResponse);
        renderLog(auditResponse);
        renderAlerts(totalBoxes, occupancy);
        setStatus(true);
    } catch (error) {
        setStatus(false);
        renderGrid([]);
        document.getElementById("stat-estoque-atual").textContent = "0";
        document.getElementById("stat-entradas-hoje").textContent = "0";
        document.getElementById("stat-saidas-hoje").textContent = "0";
        document.getElementById("stat-ocupacao").textContent = "0%";

        logList.innerHTML = "";
        const empty = document.createElement("div");
        empty.className = "log-row";
        empty.textContent = "Falha ao conectar com a API.";
        logList.appendChild(empty);

        alertsList.innerHTML = "";
        const alert = document.createElement("div");
        alert.className = "alert-row";
        alert.innerHTML = '<span class="alert-icon level-critical"></span><div class="alert-body"><span class="alert-title">API indisponível</span><span class="alert-desc">Verifique se o backend está em execução e se o CORS está habilitado.</span></div>';
        alertsList.appendChild(alert);
    }
}

async function handleRegisterInput() {
    const tag = normalizeTag(rfidInput.value);
    if (!tag) {
        setActionMessage("Informe o RFID da caixa antes de registrar a entrada.", true);
        return;
    }

    try {
        const result = await apiRequest(`${API_BASE_URL}/box/input/${encodeURIComponent(tag)}`, { method: "POST" });
        setActionMessage(`Entrada registrada com sucesso: ${tag}`);
        if (result && result.tag_rfid) {
            rfidInput.value = result.tag_rfid;
            rowInput.value = Number(result.row) + 1;
            columnInput.value = Number(result.column) + 1;
        }
        await loadWarehouseData();
    } catch (error) {
        setActionMessage(error.message || "Erro ao registrar entrada.", true);
    }
}

async function handleRegisterOutput() {
    const tag = normalizeTag(rfidInput.value);
    if (!tag) {
        setActionMessage("Informe o RFID da caixa antes de registrar a saída.", true);
        return;
    }

    try {
        await apiRequest(`${API_BASE_URL}/box/output/${encodeURIComponent(tag)}`, { method: "POST" });
        setActionMessage(`Saída registrada com sucesso: ${tag}`);
        rfidInput.value = "";
        rowInput.value = "";
        columnInput.value = "";
        await loadWarehouseData();
    } catch (error) {
        setActionMessage(error.message || "Erro ao registrar saída.", true);
    }
}

async function handleMoveBox() {
    const tag = normalizeTag(rfidInput.value);
    const row = Number(rowInput.value);
    const column = Number(columnInput.value);

    if (!tag) {
        setActionMessage("Informe o RFID da caixa para mover.", true);
        return;
    }

    if (!Number.isInteger(row) || !Number.isInteger(column) || row < 1 || column < 1 || row > GRID_ROWS || column > GRID_COLS) {
        setActionMessage("Informe uma linha e coluna válidas de 1 a 10.", true);
        return;
    }

    try {
        await apiRequest(`${API_BASE_URL}/${encodeURIComponent(tag)}/position?row=${row - 1}&column=${column - 1}`, { method: "PATCH" });
        setActionMessage(`Posição atualizada para a caixa ${tag}`);
        await loadWarehouseData();
    } catch (error) {
        setActionMessage(error.message || "Erro ao mover a caixa.", true);
    }
}

async function handleDeleteBox() {
    const tag = normalizeTag(rfidInput.value);
    if (!tag) {
        setActionMessage("Informe o RFID da caixa para excluir.", true);
        return;
    }

    const confirmed = window.confirm(`Deseja excluir permanentemente a caixa ${tag}?`);
    if (!confirmed) {
        return;
    }

    try {
        await apiRequest(`${API_BASE_URL}/${encodeURIComponent(tag)}`, { method: "DELETE" });
        setActionMessage(`Caixa removida com sucesso: ${tag}`);
        rfidInput.value = "";
        rowInput.value = "";
        columnInput.value = "";
        await loadWarehouseData();
    } catch (error) {
        setActionMessage(error.message || "Erro ao excluir a caixa.", true);
    }
}

document.getElementById("btn-input").addEventListener("click", handleRegisterInput);
document.getElementById("btn-output").addEventListener("click", handleRegisterOutput);
document.getElementById("btn-move").addEventListener("click", handleMoveBox);
document.getElementById("btn-delete").addEventListener("click", handleDeleteBox);

buildGridHeaders();
renderGrid([]);
setStatus(false);
loadWarehouseData();
setInterval(loadWarehouseData, 20000);

</script>
